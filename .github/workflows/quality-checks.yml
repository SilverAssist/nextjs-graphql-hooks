name: Plugin Quality Checks

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    quality-checks:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            matrix:
                php-version: [8.2, 8.3]
                wordpress-version: [6.5, 6.6, latest]

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: nextjs_graphql_hooks_test
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.2.2

            - name: Setup PHP
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysqli, pdo_mysql, sqlite, pdo_sqlite
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-suggest

            - name: Run PHP CodeSniffer
              run: composer run phpcs

            - name: Check PHP syntax
              run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

            - name: Install Subversion (required for WordPress Test Suite)
              run: sudo apt-get update && sudo apt-get install -y subversion

            - name: Install WordPress Test Suite
              env:
                  WP_VERSION: ${{ matrix.wordpress-version }}
              run: bash scripts/install-wp-tests.sh nextjs_graphql_hooks_test root root 127.0.0.1 ${{ matrix.wordpress-version }} true

            - name: Run PHPUnit
              env:
                  WP_TESTS_DIR: /tmp/wordpress-tests-lib
              run: vendor/bin/phpunit

    security-check:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.2.2

            - name: Setup PHP
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
              with:
                  php-version: 8.3

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run security check
              run: |
                  # Check for common security issues (excluding vendor, .github, tests, and other non-source directories)
                  # tests/ is excluded from the eval() check: PluginTest.php legitimately uses eval() to
                  # stub an external plugin class (WPGraphQL) for an isolated-process test — see
                  # tests/Unit/PluginTest.php::test_init_updater_constructs_updater_when_wpgraphql_active().
                  # Same exclusion convention already used by acf-clone-fields's ci.yml for the same reason.
                  grep -r "eval(" . --exclude-dir=vendor --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=tests && exit 1 || echo "✅ No eval() found"
                  grep -r "\$_GET\[" . --exclude-dir=vendor --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=.git && echo "⚠️  Direct \$_GET usage found" || echo "✅ No direct \$_GET usage"
                  grep -r "\$_POST\[" . --exclude-dir=vendor --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=.git && echo "⚠️  Direct \$_POST usage found" || echo "✅ No direct \$_POST usage"
                  grep -r "file_get_contents.*http" . --exclude-dir=vendor --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=.git && exit 1 || echo "✅ No remote file_get_contents found"

    compatibility-check:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.2.2

            - name: Setup PHP
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
              with:
                  php-version: 8.2

            - name: Check PHP 8.2+ compatibility
              run: |
                  # Check for PHP 8.2+ features usage
                  php -r "
                    if (version_compare(PHP_VERSION, '8.2.0', '<')) {
                      echo 'PHP 8.2+ required';
                      exit(1);
                    }
                    echo '✅ PHP version compatible';
                  "

            - name: WordPress compatibility check
              run: |
                  # Basic WordPress function usage validation (excluding vendor, .github, and other non-source directories)
                  grep -r "add_action\|add_filter\|wp_enqueue" . --exclude-dir=vendor --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=.git && echo "✅ WordPress functions found" || echo "⚠️  No WordPress functions detected"
